name: CI - Lint and Test

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint and test tools
        run: python -m pip install --upgrade pip ruff pytest

      - name: Run code linting
        run: |
          if find . -type f -name '*.py' -not -path './.git/*' | grep -q .; then
            ruff check .
          else
            git diff --check
            echo 'No Python source files found; whitespace lint completed.'
          fi

      - name: Run tests
        run: |
          if find . -type f \( -name 'test_*.py' -o -name '*_test.py' \) -not -path './.git/*' | grep -q .; then
            pytest
          else
            echo 'No test files found; test discovery completed.'
          fi
